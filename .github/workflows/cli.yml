name: CLI binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            script: package:linux
            binary: partyplanner64-cli-linux
          - name: windows
            os: windows-latest
            script: package:win
            binary: partyplanner64-cli-win.exe
          - name: macos-intel
            os: macos-15-intel
            script: package:macos-intel
            binary: partyplanner64-cli-macos-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/cli/package-lock.json

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          npm ci --prefix apps/cli

      - name: Build CLI
        working-directory: apps/cli
        run: npm run build

      - name: Package binary
        working-directory: apps/cli
        run: npm run ${{ matrix.script }}

      - name: Confirm macOS Intel binary
        if: matrix.name == 'macos-intel'
        working-directory: apps/cli
        shell: bash
        run: file "./dist/pkg/${{ matrix.binary }}" | grep -E 'x86_64|i386'

      - name: Smoke test
        working-directory: apps/cli
        shell: bash
        run: |
          bin="./dist/pkg/${{ matrix.binary }}"
          "$bin" help
          "$bin" help | grep -q "PartyPlanner64"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: apps/cli/dist/pkg/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/partyplanner64-cli-linux/partyplanner64-cli-linux \
            dist/partyplanner64-cli-win.exe/partyplanner64-cli-win.exe \
            dist/partyplanner64-cli-macos-intel/partyplanner64-cli-macos-intel \
            --clobber
